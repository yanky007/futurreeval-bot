name: Daily checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC = 8:17 am New Jersey time (EST)

jobs:
  checks:
    runs-on: ubuntu-latest
    if: vars.LIVE == 'true'
    timeout-minutes: 15
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Missed questions (forfeit sweep)
        run: uv run python scripts/forfeit_sweep.py
