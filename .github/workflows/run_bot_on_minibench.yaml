name: Forecast on MiniBench

on:
  workflow_dispatch:
  schedule:
    - cron: "9,29,49 * * * *" # offset from the main workflow

concurrency:
  group: forecast-paid
  cancel-in-progress: false   # never kill a run mid-question

jobs:
  forecast_job:
    if: vars.LIVE == 'true'   # set in Settings > Secrets and variables > Actions > Variables
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Run bot
        run: uv run python main.py --mode minibench
        env:
          LOG_LEVEL: WARNING
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      - name: Save logs (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 90
